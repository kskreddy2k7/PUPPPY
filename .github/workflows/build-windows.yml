name: Build Windows Application

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Automated Tests
        run: |
          python -m unittest discover -s tests -p "test_*.py"

      - name: Build Executable
        shell: cmd
        run: |
          call scripts\build_windows.bat

      - name: Verify Executable Exists
        shell: cmd
        run: |
          if not exist "dist\CutePuppy.exe" (
            echo "ERROR: dist\CutePuppy.exe was not created!"
            exit 1
          )

      - name: Package Windows ZIP
        run: |
          powershell Compress-Archive -Path dist/CutePuppy.exe -DestinationPath dist/CutePuppy-Windows.zip

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CutePuppy-Windows
          path: |
            dist/CutePuppy.exe
            dist/CutePuppy-Windows.zip
