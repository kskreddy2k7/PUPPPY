[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cute_puppy"
version = "1.0.0"
description = "A lightweight cross-platform virtual desktop puppy for Windows and macOS"
authors = [{ name = "Cute Puppy Team" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PySide6>=6.5.0",
    "Pillow>=9.5.0",
]

[project.scripts]
cute-puppy = "cute_puppy.main:main"

[tool.setuptools.packages.find]
where = ["src"]
